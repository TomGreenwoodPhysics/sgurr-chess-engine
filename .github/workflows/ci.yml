name: CI

# What this proves, and why it is shaped this way.
#
# The engine's search is deterministic: `bench` walks a fixed position list to
# a fixed depth with no clock and no randomness, so its node total is a
# fingerprint of *what* the engine searches. Comparing that number is stronger
# than a unit test -- it fails on any behaviour change anywhere in movegen,
# search or evaluation, including ones a test suite would not think to look
# for. It is also what lets speed-only work be proved rather than argued.
#
# The fingerprint is reproducible within a toolchain, not across them: see the
# note above the fingerprint steps. CI therefore checks the properties that do
# hold everywhere -- determinism, and vectorised/scalar agreement -- rather
# than a constant copied from another machine.
#
# That second claim ("the SIMD paths are a speed change and never a numeric
# one") is load-bearing for the whole project, so it is checked on every push
# rather than trusted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Reference values from the MSYS2 clang64 development toolchain. Reported for
  # comparison, not asserted: see the fingerprint note below for why the node
  # totals are toolchain-specific. EVALSUM is asserted, since the NNUE forward
  # pass is pure integer arithmetic and genuinely is identical everywhere.
  BENCH_NNUE: "3601424"   # 19 positions at depth 11, gen8 net
  BENCH_HCE: "4616415"    # same, hand-crafted eval (no network loaded)
  EVALSUM: "-142859"      # nnue_selfcheck checksum, identical on all paths

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: clang++ --version

      # -march=x86-64-v3 rather than -march=native: it pins the AVX2 baseline
      # so the build does not silently vary with whatever runner we land on.
      # No -static here; that flag exists in build.sh for the Windows harness.
      - name: Build engine (vectorised)
        run: |
          cd sgurr_cpp
          clang++ -std=c++20 -O3 -march=x86-64-v3 -DNDEBUG -Wall -Wextra \
            main.cpp board.cpp evaluation.cpp search.cpp nnue.cpp -o sgr

      - name: Build engine (scalar inference)
        run: |
          cd sgurr_cpp
          clang++ -std=c++20 -O3 -march=x86-64-v3 -DNDEBUG -Wall -Wextra \
            -DSGR_SIMD=0 \
            main.cpp board.cpp evaluation.cpp search.cpp nnue.cpp -o sgr_scalar

      - name: Build data generator
        run: |
          cd sgurr_cpp
          clang++ -std=c++20 -O3 -march=x86-64-v3 -DNDEBUG -Wall -Wextra \
            -DSGR_RFP=0 \
            datagen.cpp board.cpp evaluation.cpp search.cpp nnue.cpp -o datagen

      - name: Build NNUE self-check
        run: |
          cd sgurr_cpp
          clang++ -std=c++20 -O3 -march=x86-64-v3 -DNDEBUG -Wall -Wextra \
            nnue_selfcheck.cpp board.cpp evaluation.cpp search.cpp nnue.cpp \
            -o nnue_selfcheck

      - name: Engine starts and identifies itself
        run: |
          cd sgurr_cpp
          printf 'uci\nquit\n' | ./sgr | grep -q '^uciok$'
          printf 'uci\nquit\n' | ./sgr | sed -n 's/^id name //p'

      # The fingerprint is a WITHIN-TOOLCHAIN invariant, not a universal
      # constant, so CI asserts the invariant rather than a magic number.
      #
      # Why: order_moves sorts with std::sort, which is not stable, so moves
      # with equal scores come out in an order the standard library chooses.
      # libstdc++ here and libc++ on the MSYS2 clang64 development machine
      # choose differently, which is a different search rather than a faster
      # one -- board.cpp and search.cpp both already flag that sensitivity.
      # Measured: 3457351 nodes here against 3601424 there, same source.
      #
      # This does not weaken the instrument for the job it does. Speed-only
      # work is verified by diffing two builds from ONE toolchain, which is
      # exactly what the three checks below reproduce.
      #
      # stdout carries the deterministic node counts; wall time, NPS and the
      # loaded net go to stderr, so 2>/dev/null compares only the stable part.
      - name: Search is deterministic (same binary, repeated runs)
        run: |
          cd sgurr_cpp
          diff <(SGR_EVALFILE=../nets/gen8.nnue ./sgr bench 2>/dev/null) \
               <(SGR_EVALFILE=../nets/gen8.nnue ./sgr bench 2>/dev/null) \
            || { echo "::error::bench is not deterministic across runs."; exit 1; }
          fp=$(SGR_EVALFILE=../nets/gen8.nnue ./sgr bench 2>/dev/null | tail -1 | awk '{print $2}')
          echo "fingerprint on this toolchain: $fp"
          echo "reference on MSYS2 clang64:    $BENCH_NNUE"
          echo "FP=$fp" >> "$GITHUB_ENV"

      - name: Hand-crafted eval fingerprint is deterministic
        run: |
          cd sgurr_cpp
          diff <(./sgr bench 2>/dev/null) <(./sgr bench 2>/dev/null)
          echo "HCE fingerprint: $(./sgr bench 2>/dev/null | tail -1 | awk '{print $2}')"

      # The real claim, and it IS platform-independent: vectorised and scalar
      # inference are bit-identical, so the vector paths buy speed and change
      # nothing numeric. Both binaries come from this toolchain, so the
      # std::sort tie order is common to them and cancels.
      - name: Scalar inference agrees with vectorised
        run: |
          cd sgurr_cpp
          diff <(SGR_EVALFILE=../nets/gen8.nnue ./sgr        bench 2>/dev/null) \
               <(SGR_EVALFILE=../nets/gen8.nnue ./sgr_scalar bench 2>/dev/null) \
            || { echo "::error::SIMD and scalar inference disagree. One of them is wrong."; exit 1; }
          echo "vectorised and scalar fingerprints are byte-identical at $FP nodes"

      - name: Move generation, unmake and null-move restoration
        run: |
          cd sgurr_cpp
          out=$(./sgr test 2>&1)
          echo "$out" | grep -q 'perft(1) = 20'
          echo "$out" | grep -q 'perft(2) = 400'
          echo "$out" | grep -q 'perft(3) = 8902'
          echo "$out" | grep -q 'perft(4) = 197281'
          echo "$out" | grep -q 'null restored hash = yes'
          echo "$out" | grep -q 'null restored eval = yes'

      - name: Static exchange evaluation
        run: |
          cd sgurr_cpp
          ./sgr seetest 2>&1 | tee /dev/stderr | grep -q 'SEE: 9/9 passed'

      # Verifies engine inference against the trainer's own forward pass across
      # every special move type plus thousands of random game chains, and emits
      # a cross-build checksum.
      - name: NNUE bit-exactness against the trainer
        run: |
          cd sgurr_cpp
          out=$(./nnue_selfcheck ../nets/gen8.nnue 2>&1)
          echo "$out"
          echo "$out" | grep -q 'fails=0'
          echo "$out" | grep -q -- "-> PASS"
          echo "$out" | grep -q "evalsum=$EVALSUM"

      - name: Committed network matches its recorded hash
        run: |
          echo "896eb832d74776a42375e7fa152b4e032fff1cf85ba2e529b420fe2d1b4b74bf  nets/gen8.nnue" \
            | sha256sum --check --strict

  harness:
    name: test harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sprt.py decided whether every search change in this project shipped.
      # These cover the statistics and the stopping rule against closed-form
      # values and invariants; no engine is started, so it runs in
      # milliseconds. -W error::ResourceWarning because a leaked file handle
      # is how the book loader was found to be holding one open.
      - name: SPRT statistics and decision rule
        run: python -W error::ResourceWarning -m unittest discover -s testing -p "test_*.py" -v

  backend:
    name: web backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r web/backend/requirements.lock.txt

      - name: Unit tests (draw rules, production config boundaries)
        run: python -m unittest discover -s web/backend -p "test_*.py" -v

  container:
    name: web container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sgurr-web .

      - name: Start container
        run: docker run -d --name sgurr-web -p 8000:10000 sgurr-web

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 90); do
            curl --fail --silent http://127.0.0.1:8000/ready && exit 0
            sleep 1
          done
          exit 1

      - name: Exercise live engine paths
        run: python web/tests/container_smoke.py http://127.0.0.1:8000

      - name: Container logs
        if: always()
        run: docker logs sgurr-web || true

      - name: Stop container
        if: always()
        run: docker rm --force sgurr-web || true

  browser:
    name: web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The suite serves the frontend itself and intercepts backend requests,
      # so it needs no engine binary and no running API.
      - name: Browser smoke tests
        working-directory: web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
